[project]
name = "ai-investor"
version = "0.1.0"
description = "AI 投顾策略内核 — A股质量-现金流-景气研究中台"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0,<3.0",
    "polars>=1.0",
    "duckdb>=1.0",
    "pyyaml>=6.0",
    "click>=8.0",
]

[project.optional-dependencies]
live = [
    "akshare>=1.14",
    "pyarrow>=15.0.0",
]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "check-jsonschema>=0.28",
    "types-PyYAML",
]

[project.scripts]
ai-investor = "ai_investor.cli.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_investor"]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
